name: build

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci_Only_Passw0rd!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Ci_Only_Passw0rd!' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      NEWSARCHIVE_TEST_DB: "Server=localhost,1433;Database=NewsArchiveTestDB;User Id=sa;Password=Ci_Only_Passw0rd!;TrustServerCertificate=True;"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore NewsArchiveSolution/NewsArchiveSolution.slnx
      - name: Build
        run: dotnet build NewsArchiveSolution/NewsArchiveSolution.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test NewsArchiveSolution/NewsArchive.Tests/NewsArchive.Tests.csproj --configuration Release --no-build --verbosity normal
      - name: Vulnerable packages
        run: dotnet list NewsArchiveSolution/NewsArchiveSolution.slnx package --vulnerable --include-transitive
