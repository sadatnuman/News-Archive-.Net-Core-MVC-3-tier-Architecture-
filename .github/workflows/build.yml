name: build

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore NewsArchiveSolution/NewsArchiveSolution.slnx
      - name: Build
        run: dotnet build NewsArchiveSolution/NewsArchiveSolution.slnx --configuration Release --no-restore
      - name: Vulnerable packages
        run: dotnet list NewsArchiveSolution/NewsArchiveSolution.slnx package --vulnerable --include-transitive
