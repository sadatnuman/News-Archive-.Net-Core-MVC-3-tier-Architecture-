<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Offline | The Meridian Newsfolio</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <style>
        :root { color-scheme: light dark; --paper: #fbfaf7; --ink: #121212; --muted: #5c5c5c; --accent: #c8102e; --card: #ffffff; --line: #e7e4dd; }
        @media (prefers-color-scheme: dark) { :root { --paper: #121212; --ink: #f2f2f2; --muted: #a3a3a3; --accent: #ff4d5e; --card: #181818; --line: #2a2a2a; } }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--paper); color: var(--ink); font-family: Georgia, "Noto Serif Bengali", serif; }
        main { width: 100%; max-width: 520px; background: var(--card); border: 1px solid var(--line); border-top: 4px solid var(--accent); border-radius: 10px; padding: 28px 24px; text-align: center; }
        img { width: 64px; height: auto; }
        h1 { font-size: 1.6rem; margin: 16px 0 8px; }
        p { color: var(--muted); line-height: 1.6; margin: 0 0 12px; font-family: system-ui, "Noto Sans Bengali", sans-serif; }
        .bn { border-top: 1px solid var(--line); margin-top: 18px; padding-top: 18px; }
        button { margin-top: 12px; min-height: 44px; padding: 0 20px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font: 600 1rem system-ui, sans-serif; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <img src="/images/brand/icon-192.png" alt="" width="64" height="64" />
        <h1>You're offline</h1>
        <p>We couldn't reach The Meridian Newsfolio. Check your connection and try again.</p>
        <div class="bn" lang="bn">
            <h1>আপনি অফলাইনে আছেন</h1>
            <p>দ্য মেরিডিয়ান নিউজফোলিওতে পৌঁছানো যাচ্ছে না। ইন্টারনেট সংযোগ দেখে আবার চেষ্টা করুন।</p>
        </div>
        <button type="button" id="retry">Try again / আবার চেষ্টা করুন</button>
    </main>
    <script src="/js/offline.js"></script>
</body>
</html>
